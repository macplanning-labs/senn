{% if notifications.is_empty() %}
<div class="notif-empty">通知はありません</div>
{% else %}
{% for n in notifications %}
<a class="notif-item {% if !n.is_read %}unread{% endif %}" href="/notifications/read/{{ n.id }}">
  <span class="notif-item-icon">{{ n.category_enum().icon() }}</span>
  <div class="notif-item-content">
    <div class="notif-item-title">{{ n.title }}</div>
    {% if !n.message.is_empty() %}
    <div class="notif-item-message">{{ n.message }}</div>
    {% endif %}
    <div class="notif-item-time">{{ n.created_at|date }}</div>
  </div>
  {% if !n.is_read %}
  <div class="notif-unread-dot"></div>
  {% endif %}
</a>
{% endfor %}
{% endif %}
