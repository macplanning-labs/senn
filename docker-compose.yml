# ============================================================
# docker-compose.yml — SENN OSS ローカル一発起動
# ============================================================
# 使い方:
#   cp .env.example .env
#   # .env の DB_PASSWORD と JWT_SECRET_KEY を必ず設定する(README の Start の sed 1行で自動入力できる。空のままだとエラーで停止)
#   docker compose up               （ビルド済みイメージを取得して起動）
#   docker compose up --build       （ソースからビルドして起動）
#
# 入口: http://localhost:8151
# 秘密は .env のみ（本ファイルに平文で埋め込まない）
#
# コンテナ名は固定しない(同じ PC で別の SENN と名前がぶつからないように)。
# 別の SENN と並べて動かすときは、プロジェクト名とポートを変える:
#   docker compose -p senn-old up     ( .env の PORT / BASE_URL / WEBAUTHN_RP_ORIGIN も別の番号に)
# プロジェクト名(既定 senn-oss)を変えると、データの保存先(ボリューム)も別になる
# ============================================================

name: senn-oss

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: senn
      POSTGRES_USER: senn
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is empty. Set it in .env - see Start in README.md (openssl rand -hex 24)}
    volumes:
      - senn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senn -d senn"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${SENN_IMAGE_REGISTRY:-ghcr.io/macplanning-labs}/senn-backend:${SENN_IMAGE_TAG:-latest}
    build:
      context: ./rust
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://senn:${DB_PASSWORD:?DB_PASSWORD is empty. Set it in .env - see Start in README.md (openssl rand -hex 24)}@db:5432/senn
      PORT: "8151"
      # 登録の方式とメール送信(任意)。.env に書いた値をバックエンドに渡す(README「Adding people」参照)
      SENN_REGISTRATION_MODE: ${SENN_REGISTRATION_MODE:-}
      SENN_INTERNAL_EMAIL_DOMAINS: ${SENN_INTERNAL_EMAIL_DOMAINS:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      BASE_URL: ${BASE_URL:-http://localhost:8151}
      COOKIE_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is empty. Set it in .env - see Start in README.md (openssl rand -base64 48)}
      RUST_RUN_MIGRATIONS: "true"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGIN: ${BASE_URL:-http://localhost:8151}
      MEDIA_DIR: /app/media
      # AIエージェント(Claude等)専用の外部API用キー。既定値は持たない(空なら AI 用 API は無効)。
      # 使うときだけ .env に設定する(例: openssl rand -hex 32)。既定値を置くと、誰でも知っている鍵で入れてしまう
      SENN_AI_API_KEY: ${SENN_AI_API_KEY:-}
    volumes:
      - senn_media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${SENN_IMAGE_REGISTRY:-ghcr.io/macplanning-labs}/senn-web:${SENN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8151}:80"
    depends_on:
      - backend

volumes:
  senn_pgdata:
  senn_media:
