# SENN OSS Self-host nginx configuration
# Simplified version for local deployments (no Cloudflare Tunnel)
# Same routing as nginx.conf but without Tunnel-specific headers

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Media files (attachments)
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # SPA assets (Vite build output)
    location /assets/ {
        alias /app/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Tickets API (Rust)
    location /api/v1/tickets/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Auth API (Rust)
    location /api/v1/auth/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # External API (Rust) — no auth required (X-API-Key header validated in handler)
    location /api/v1/external/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # AI Agent API (Rust) — no auth required (X-AI-Api-Key header validated in handler)
    location /api/v1/ai-agent/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # GitHub Webhook (Rust) — no auth required (HMAC signature validated in handler)
    location /api/v1/webhooks/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Users API (Rust)
    location /api/v1/users/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # System Admin API (Rust) — staff only
    location /api/v1/system-admin/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Settings API (Rust) — TOTP/Passkey registration/revocation
    location /api/v1/settings/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # AI prompt generation (Ollama can take up to 300s)
    location = /api/v1/ai/generate-prompt-text/ {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # All other API endpoints (Rust) — projects/categories/milestones/labels/
    # notifications/cycles/teams/memberships/team-rules/workflow-statuses/
    # time-entries/triage-requests/wiki/search/reports/dashboard/integrations/ai/holidays
    location ~ ^/api/v1/(projects|categories|milestones|labels|notifications|cycles|teams|memberships|team-rules|workflow-statuses|time-entries|triage-requests|wiki|search|reports|dashboard|integrations|ai|holidays)(/|$) {
        proxy_pass http://rust:8151;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # SPA fallback (client-side routing support)
    # All routes not matching above locations fallback to index.html
    location / {
        root /app/frontend/dist;
        # If file doesn't exist, fallback to index.html for client-side routing
        try_files $uri /index.html;
    }
}
