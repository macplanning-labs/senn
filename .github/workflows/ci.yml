name: CI

# Runs the same checks as the maintainer script `run_local_ci.sh`:
#   rust:     cargo check --workspace / cargo test --workspace
#   frontend: npm ci / lint / build / test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (check / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      # No compile-time-checked sqlx macros are used, so no database
      # (and no .sqlx offline data) is needed to build.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned by rust/rust-toolchain.toml; rustup honours it.
      - name: Show toolchain
        run: rustup show

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend (lint / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
