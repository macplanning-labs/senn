name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 履歴全体を走査するため。浅いクローンだと過去コミットを見逃す
          fetch-depth: 0

      # gitleaks-action@v2 は Organization のリポジトリでライセンスキーを要求する。
      # gitleaks 本体は MIT ライセンスで自由に使えるため、バイナリを直接実行する。
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact は必須。このリポジトリは公開されており、Actions のログも
      # 誰でも読める。検出時に値そのものをログへ出してはいけない。
      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-report.json

      # 失敗したときに、値ではなくルール名とファイルパスだけを残す
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
