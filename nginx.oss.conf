# ============================================================
# nginx.oss.conf — SENN OSS ローカル一発起動用リバースプロキシ
# /api /auth /static /media /health /swagger-ui /api-docs → Rust backend
# それ以外 → Vite SPA 静的ビルド（クライアントルーティングのため index.html にフォールバック）
# ============================================================

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    location ~ ^/(api|auth|static|media|health|swagger-ui|api-docs)(/|$) {
        proxy_pass http://backend:8151;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
