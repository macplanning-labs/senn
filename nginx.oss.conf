# ============================================================
# nginx.oss.conf — SENN OSS ローカル一発起動用リバースプロキシ
# /api /auth /static /media /health /swagger-ui /api-docs → Rust backend
# それ以外 → Vite SPA 静的ビルド（クライアントルーティングのため index.html にフォールバック）
# ============================================================

# WebSocket(リアルタイム同期)の接続を保つための Connection ヘッダー
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # リアルタイム同期(WebSocket)。^~ で下の正規表現より優先させる(Upgrade ヘッダーが要るため)。
    # 接続用トークンが URL に載るので、この経路はアクセスログに残さない
    location ^~ /api/v1/realtime/ws {
        access_log off;
        proxy_pass http://backend:8151;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/(api|auth|static|media|health|swagger-ui|api-docs)(/|$) {
        proxy_pass http://backend:8151;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
