<style>
  /* ===== Premium Dashboard Styles ===== */

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .stat-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 800; line-height: 1; }
  .stat-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }

  .stat-total .stat-value { color: var(--primary); }
  .stat-total .stat-icon { background: var(--primary-bg); }
  .stat-total::before { background: var(--primary); }

  .stat-open .stat-value { color: #475569; }
  .stat-open .stat-icon { background: #f1f5f9; }
  .stat-open::before { background: #64748b; }

  .stat-progress .stat-value { color: #0284c7; }
  .stat-progress .stat-icon { background: #f0f9ff; }
  .stat-progress::before { background: #0284c7; }

  .stat-resolved .stat-value { color: #d97706; }
  .stat-resolved .stat-icon { background: #fffbeb; }
  .stat-resolved::before { background: #d97706; }

  .stat-closed .stat-value { color: #16a34a; }
  .stat-closed .stat-icon { background: #f0fdf4; }
  .stat-closed::before { background: #16a34a; }

  .stat-overdue .stat-value { color: #dc2626; }
  .stat-overdue .stat-icon { background: #fef2f2; }
  .stat-overdue::before { background: #dc2626; }

  /* Dashboard Layout */
  .dashboard-full { margin-bottom: 24px; }
  .dashboard-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 1024px) { .dashboard-2col { grid-template-columns: 1fr; } }

  /* Section Headers */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border-light);
  }
  .section-title {
    font-size: 15px; font-weight: 700; color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
  }
  .section-icon {
    width: 28px; height: 28px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  /* Ticket Activity Table */
  .activity-table { width: 100%; border-collapse: separate; border-spacing: 0; }
  .activity-table thead th {
    padding: 10px 14px; font-size: 11px; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
    text-align: left; background: var(--bg-body); border-bottom: 1px solid var(--border);
  }
  .activity-table tbody td {
    padding: 12px 14px; border-bottom: 1px solid var(--border-light);
    font-size: 13px; vertical-align: middle;
  }
  .activity-table tbody tr { transition: background 0.1s; }
  .activity-table tbody tr:hover { background: var(--bg-hover); }
  .activity-table tbody tr:last-child td { border-bottom: none; }
  .ticket-id-link { font-family: 'SF Mono','Consolas',monospace; font-weight: 700; color: var(--primary); font-size: 12px; }

  /* Progress Bar */
  .progress-bar-wrap { height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .progress-teal { background: linear-gradient(90deg, #0d9488, #14b8a6); }
  .progress-green { background: linear-gradient(90deg, #16a34a, #4ade80); }

  /* Milestone Progress */
  .milestone-item { padding: 14px 0; border-bottom: 1px solid var(--border-light); }
  .milestone-item:last-child { border-bottom: none; }
  .milestone-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .milestone-name { font-size: 13px; font-weight: 600; }
  .milestone-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 12px; }

  /* Member Performance */
  .member-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border-light); }
  .member-item:last-child { border-bottom: none; }
  .member-rank {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; flex-shrink: 0;
  }
  .rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; }
  .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; }
  .rank-3 { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
  .rank-default { background: var(--bg-hover); color: var(--text-secondary); }
  .member-info { flex: 1; }
  .member-name { font-size: 13px; font-weight: 600; }
  .member-stats { font-size: 11px; color: var(--text-muted); }
  .member-count { font-size: 18px; font-weight: 800; color: var(--primary); flex-shrink: 0; }

  /* My Task Tabs */
  .my-tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    flex-wrap: wrap; border-bottom: 1px solid var(--border-light); padding-bottom: 12px;
  }
  .my-tab {
    padding: 7px 16px; border-radius: 20px; font-size: 12px;
    font-weight: 500; color: var(--text-secondary);
    text-decoration: none; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .my-tab:hover { background: var(--bg-hover); text-decoration: none; color: var(--text-primary); }
  .my-tab.active { background: var(--primary-bg); color: var(--primary); font-weight: 600; }
  .my-tab .count {
    background: var(--bg-body); padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .my-tab.active .count { background: rgba(13,148,136,0.15); }
  .my-tab.overdue { color: var(--danger); }
  .my-tab.overdue .count { background: var(--danger-bg); color: var(--danger); }

  /* Ticket Mini */
  .ticket-mini { padding: 14px 0; border-bottom: 1px solid var(--border-light); }
  .ticket-mini:last-child { border-bottom: none; }
  .ticket-mini-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .ticket-mini-key { font-size: 12px; font-weight: 700; color: var(--primary); min-width: 72px; font-family: 'SF Mono','Consolas',monospace; }
  .ticket-mini-title { font-size: 13px; font-weight: 500; color: var(--text-primary); flex: 1; }
  .ticket-mini-title:hover { color: var(--primary); }
  .ticket-mini-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 14px; padding-left: 82px; }

  /* Empty State */
  .empty-premium { text-align: center; padding: 48px 24px; color: var(--text-muted); }
  .empty-premium-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
</style>
