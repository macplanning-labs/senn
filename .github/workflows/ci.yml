name: CI

# Runs the same checks as the maintainer script `run_local_ci.sh`:
#   rust:     cargo check --workspace / cargo test --workspace
#   frontend: npm ci / lint / build / test
#   ai-runner, mcp-server: npm test (mcp-server also npm audit)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (check / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      # No compile-time-checked sqlx macros are used, so no database
      # (and no .sqlx offline data) is needed to build.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned by rust/rust-toolchain.toml; rustup honours it.
      - name: Show toolchain
        run: rustup show

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend (lint / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  ai-runner:
    name: AI runner (test)
    runs-on: ubuntu-latest
    # The runner has no dependencies; tests use fakes (no Docker, Claude, or SENN needed).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('tools/ai-runner/package.json') != '' }}
        with:
          node-version: "22"
      - name: Test
        if: ${{ hashFiles('tools/ai-runner/package.json') != '' }}
        working-directory: tools/ai-runner
        run: npm test

  mcp-server:
    name: MCP server (test / audit)
    runs-on: ubuntu-latest
    # Tests run with a temporary HOME and fakes (no SENN server or real credentials needed).
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('mcp-server/package-lock.json') != '' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install dependencies
        if: ${{ hashFiles('mcp-server/package-lock.json') != '' }}
        run: npm ci
      - name: Test
        if: ${{ hashFiles('mcp-server/package-lock.json') != '' }}
        run: npm test
      - name: Audit (high or above)
        if: ${{ hashFiles('mcp-server/package-lock.json') != '' }}
        run: npm audit --audit-level=high
