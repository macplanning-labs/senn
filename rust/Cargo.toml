[package]
name = "wip"
version = "0.1.0"
edition = "2021"
description = "WIP — プロジェクト管理ツール（チケット・ガントチャート・Wiki）"

# ルートパッケージ(wip)を維持したまま、共通認証ライブラリauth-coreを
# ワークスペースメンバーとして追加する(Step 1: auth-coreクレート雛形切り出し)。
# 既存のディレクトリ構成・Dockerfile・CI(ci.yml)は変更不要
# (cargo build/testはワークスペース全体を対象にするため自動的に対象に入る)。
[workspace]
members = ["auth-core"]

[dependencies]
# Web フレームワーク
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
governor = "0.10"

# テンプレートエンジン
askama = "0.13"

# データベース
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid", "json"] }

# セッション
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.14", features = ["postgres"] }

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日時
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# ログ
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 環境変数
dotenvy = "0.15"

# エラーハンドリング
anyhow = "1"
thiserror = "2"

# 認証
# 共通認証ライブラリ(Step 1で新設。段階的にjwt_service/totp_service/
# webauthn_service/middlewareの呼び出しをこちらへ差し替える。Step 2で対応)
auth-core = { path = "auth-core" }
argon2 = "0.5"
totp-rs = { version = "5", features = ["qr"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# webauthn-rsのpreludeがResidentKeyRequirementを再エクスポートしていないため直接依存させる
webauthn-rs-proto = "0.5"
jsonwebtoken = "9"
url = "2"

# TOTP秘密鍵の暗号化保存
aes-gcm = "0.10"

# メール
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# Markdown
pulldown-cmark = "0.12"

# Excel
rust_xlsxwriter = "0.80"

# CSRF
rand = "0.8"
base64 = "0.22"

# Django パスワード移行
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"

# 正規表現(Git Webhook のチケットキー抽出等)
regex = "1"

# HTTPクライアント(Ollama/OpenAI呼び出し用)
reqwest = { version = "0.12", features = ["json"] }
