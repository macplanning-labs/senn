# ============================================================
# docker-compose.yml — WIP OSS ローカル一発起動
# ============================================================
# 使い方:
#   cp .env.example .env
#   docker compose up --build
#
# 入口: http://localhost:8151
# 秘密は .env のみ（本ファイルに平文で埋め込まない）
# ============================================================

name: wip-oss

services:
  db:
    image: postgres:16-alpine
    container_name: wip-oss-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wip
      POSTGRES_USER: wip
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wip -d wip"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./rust
      dockerfile: Dockerfile
    container_name: wip-oss-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://wip:${DB_PASSWORD}@db:5432/wip
      PORT: "8151"
      BASE_URL: ${BASE_URL:-http://localhost:8151}
      COOKIE_SECURE: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      RUST_RUN_MIGRATIONS: "true"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGIN: ${BASE_URL:-http://localhost:8151}
      MEDIA_DIR: /app/media
      # AIエージェント(Claude等)専用の外部API用キー。既定値はローカルお試し用のダミー値。
      WIP_AI_API_KEY: ${WIP_AI_API_KEY:-wip-ai-demo-key}
    volumes:
      - wip_media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wip-oss-web
    restart: unless-stopped
    ports:
      - "${PORT:-8151}:80"
    depends_on:
      - backend

volumes:
  wip_pgdata:
  wip_media:
